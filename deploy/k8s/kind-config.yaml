# Local cluster: the front end's NodePorts are reachable on localhost:9080 (HTTP) and localhost:8443 (HTTPS)
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 9080
      - containerPort: 30443
        hostPort: 8443
