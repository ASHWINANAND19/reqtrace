backend:
  - changed-files:
      - any-glob-to-any-file: backend/**
frontend:
  - changed-files:
      - any-glob-to-any-file: frontend/**
devops:
  - changed-files:
      - any-glob-to-any-file: [".github/**", "deploy/**", "**/Dockerfile", "docker-compose.yml"]
docs:
  - changed-files:
      - any-glob-to-any-file: ["docs/**", "**/*.md"]
test:
  - changed-files:
      - any-glob-to-any-file: ["backend/tests/**", "loadtest/**"]
